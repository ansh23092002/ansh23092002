<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Core Brand Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8"/>
      <stop offset="100%" stop-color="#007cf0"/>
    </linearGradient>

    <!-- Accent Violet-Pink Gradient -->
    <linearGradient id="violetPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM ICON (Left) -->
  <g transform="translate(6, 6)">
    <!-- Ambient back glow -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#00dfd8" opacity="0.12" filter="url(#glow)"/>
    
    <!-- Outer Rounded Squircle -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#badgeBg)" stroke="url(#borderGlow)" stroke-width="1.8"/>

    <!-- Geometric Interlocking 'A' & 'S' Emblem -->
    <!-- Stylized 'A' Left Apex -->
    <path d="M26 12L15 36H20.5L22.8 30.5H29.2L31.5 36H37L26 12Z" fill="url(#cyanGrad)" />
    <!-- Inner cut of A -->
    <polygon points="26,18.5 24,25.5 28,25.5" fill="#0e1017"/>

    <!-- Dynamic Flowing 'S' Sweep that wraps around -->
    <path d="M19 32C19 32 23 27 30 27C34 27 36 29 36 32C36 36 31 37.5 27 39C22 41 18 42.5 18 46C18 49.5 22 51 27 51C33 51 36 47 36 47" 
          stroke="url(#violetPink)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Subtle Cyan Spark Core Dot -->
    <circle cx="39" cy="13" r="2.2" fill="#00dfd8" filter="url(#glow)"/>
  </g>

  <!-- LOGO WORDMARK (Right) -->
  <g transform="translate(72, 16)">
    <!-- Primary Name -->
    <text x="0" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.6px">
      ANSH<tspan fill="#00dfd8">.</tspan>SHARMA
    </text>

    <!-- Subtitle / Discipline -->
    <text x="0.5" y="32.5" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#71717a" letter-spacing="2px">
      FULL STACK ARCHITECT
    </text>
  </g>
</svg>
